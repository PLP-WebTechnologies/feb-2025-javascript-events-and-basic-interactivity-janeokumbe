<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h1>JavaScript Event Playground</h1>

  <section>
    <h2>1. Event Handling</h2>
    <button id="myButton">Click Me!</button>
    <div id="hoverBox">Hover over me!</div>
    <button id="secretButton">Double-Click Me!</button>
  </section>

  <section>
    <h2>2. Interactive Elements</h2>
    <button id="colorChanger">Change My Color</button>

    <div class="slider">
      <button id="prev">⏮️</button>
      <img id="sliderImg" src="https://via.placeholder.com/300?text=Image+1" />
      <button id="next">⏭️</button>
    </div>

    <div class="tabs">
      <button class="tab-btn" data-tab="1">Tab 1</button>
      <button class="tab-btn" data-tab="2">Tab 2</button>
      <div id="tab1" class="tab-content">This is Tab 1 content.</div>
      <div id="tab2" class="tab-content hidden">This is Tab 2 content.</div>
    </div>
  </section>

  <section>
    <h2>3. Form Validation</h2>
    <form id="myForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
